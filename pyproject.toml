[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localrecall"
version = "1.0.0"
description = "100% offline, privacy-first, 0 MB VRAM smart screen memory with instant OCR search and PII redaction."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Andac Basaran" }
]
keywords = [
    "recall",
    "screen-memory",
    "ocr",
    "rapidocr",
    "sqlite",
    "fts5",
    "privacy",
    "offline",
    "pyqt6",
    "windows-recall-alternative",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: Security",
]
dependencies = [
    "PyQt6>=6.6.0",
    "mss>=9.0.1",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "rapidocr-onnxruntime>=1.3.0",
    "onnxruntime>=1.17.0",
    "certifi>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://localrecall.andacbasaran.com"
Repository = "https://github.com/Andacbasaran/LocalRecall"
Issues = "https://github.com/Andacbasaran/LocalRecall/issues"
Changelog = "https://github.com/Andacbasaran/LocalRecall/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [
    ".venv",
    "build",
    "dist",
    "release_out",
    "website",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]
