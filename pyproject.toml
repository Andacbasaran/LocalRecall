[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localrecall"
version = "0.1.0"
description = "%100 offline, gizlilik odaklı, 0 MB VRAM akıllı ekran hafızası"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "mss>=9.0.1",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "rapidocr-onnxruntime>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
