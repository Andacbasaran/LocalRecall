name: OS / Desktop Compatibility Report
description: Share tested capture, hotkey, idle-sleep, or password-manager privacy behavior on your OS or Linux desktop environment.
title: "[Compatibility]: "
labels: ["compatibility"]
body:
  - type: input
    id: environment
    attributes:
      label: OS, Desktop Environment & Display Server
      placeholder: "e.g. Ubuntu 24.04 (GNOME Wayland) / macOS 15 Sequoia (M3 Pro) / Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Overall Result
      options:
        - Works Great
        - Works with Tweaks
        - Issues / Broken
    validations:
      required: true
  - type: input
    id: details
    attributes:
      label: Monitor, Hotkey & Privacy Notes
      placeholder: "e.g. Dual 4K monitors, monitor_index=0, Ctrl+Shift+Space, Bitwarden blocked cleanly"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional Details & Tips
      placeholder: Mention permissions required (TCC Screen Recording, xdotool, xprintidle) or any quirks.
