name: Bug Report
description: Report a crash, screen capture issue, OCR miss, privacy filter gap, or UI bug.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Launch LocalRecall v1.0.0
        2. Trigger capture or search for '...'
        3. Switch to tab / click button
        4. Observe error...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LocalRecall Version
      placeholder: "e.g. v1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11 (x64)
        - Windows 10 (x64)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (X11)
        - Linux (Wayland)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Screen Capture / Multi-Monitor / Idle Sleep
        - RapidOCR / ONNX CPU Engine
        - SQLite FTS5 / Hybrid Search
        - Privacy Shield / PII Redaction
        - Studio 2.0 UI / Global Hotkey / System Tray
        - Packaging / Installer / Auto-Updater
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Crash Log / Terminal Output (if any)
      description: Attach relevant lines from `crash.log` (redact any personal paths or secrets first).
      render: text
