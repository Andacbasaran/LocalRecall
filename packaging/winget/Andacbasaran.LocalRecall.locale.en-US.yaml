ShortDescription: 100% offline, privacy-first, 0 MB VRAM smart screen memory with instant OCR search and PII redaction.
Description: >-
  LocalRecall is an open-source, cross-platform alternative to Windows Recall and Rewind.
  It captures screen changes with perceptual ring-buffer deduplication, extracts on-screen
  text offline using RapidOCR (ONNX CPU, 0 MB VRAM), indexes everything into a local
  diacritic-folded SQLite FTS5 + N-Gram RRF engine (<1 ms search), and automatically
  blocks password managers, private browser tabs, and sensitive PII secrets.
